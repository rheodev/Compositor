name: Build DMG

on:
  push:
    branches:
      - compat/macos-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: Apple silicon DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build paths
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/CompositorDMG/DerivedData" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/CompositorDMG/artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -derivedDataPath "$DERIVED_DATA_PATH"
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release with ad-hoc signing
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$DERIVED_DATA_PATH"
          -onlyUsePackageVersionsFromResolvedFile
          ARCHS=arm64
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          app="$DERIVED_DATA_PATH/Build/Products/Release/Compositor.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          stage="$RUNNER_TEMP/CompositorDMG/stage"
          mkdir -p "$stage" "$ARTIFACT_DIR"
          ditto "$app" "$stage/Compositor.app"
          ln -s /Applications "$stage/Applications"
          dmg="$ARTIFACT_DIR/Compositor-$version-arm64.dmg"
          hdiutil create -volname Compositor -srcfolder "$stage" -format UDZO "$dmg"
          hdiutil verify "$dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-DMG-arm64
          path: ${{ env.ARTIFACT_DIR }}/*.dmg
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
