name: Build DMG

on:
  push:
    branches:
      - compat/macos-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: Apple silicon DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build paths
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/CompositorDMG/DerivedData" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/CompositorDMG/artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -derivedDataPath "$DERIVED_DATA_PATH"
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release with ad-hoc signing
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$DERIVED_DATA_PATH"
          -onlyUsePackageVersionsFromResolvedFile
          ARCHS=arm64
          MACOSX_DEPLOYMENT_TARGET=15.0
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          ENABLE_HARDENED_RUNTIME=NO

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          app="$DERIVED_DATA_PATH/Build/Products/Release/Compositor.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          test "$minimum" = "15.0"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          stage="$RUNNER_TEMP/CompositorDMG/stage"
          mkdir -p "$stage" "$ARTIFACT_DIR"
          ditto "$app" "$stage/Compositor.app"
          ln -s /Applications "$stage/Applications"
          dmg="$ARTIFACT_DIR/Compositor-$version-arm64.dmg"
          hdiutil create -volname Compositor -srcfolder "$stage" -format UDZO "$dmg"
          hdiutil verify "$dmg"

      # Ad-hoc builds have no Team ID, so Hardened Runtime library validation cannot load Sparkle.
      # Exercise the packaged app, not just its signature, before uploading it.
      - name: Check packaged app startup
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/CompositorDMG/mount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$ARTIFACT_DIR"/*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          APP_EXECUTABLE="$mount/Compositor.app/Contents/MacOS/Compositor" python3 <<'PY'
          import os
          import subprocess

          process = subprocess.Popen([os.environ["APP_EXECUTABLE"]])
          try:
              try:
                  status = process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  print("PASS: packaged app remained running for 10 seconds")
              else:
                  raise SystemExit(f"Packaged app exited during startup: {status}")
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          PY

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-DMG-arm64
          path: ${{ env.ARTIFACT_DIR }}/*.dmg
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
